<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthMate — Dashboard v2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #F2F2F7;
    --bg-tertiary: #E5E5EA;
    --text-primary: #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary: #AEAEB2;
    --accent: #34C759;
    --accent-secondary: #007AFF;
    --warning: #FF9500;
    --destructive: #FF3B30;
    --protein: #5E5CE6;
    --carbs: #FF9F0A;
    --fat: #FF375F;
    --fibre: #30D158;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-full: 999px;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-secondary);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex; justify-content: center;
  }
  .app-frame {
    width: 100%; max-width: 428px; min-height: 100dvh;
    background: var(--bg-primary);
    position: relative; overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
  }
  .screen { position: absolute; inset: 0; overflow-y: auto; }
  .screen::-webkit-scrollbar { display: none; }
  .screen { scrollbar-width: none; }
  .pad { padding: 0 16px; padding-bottom: 120px; }

  /* Header — single pill */
  .header {
    display: flex; justify-content: center; align-items: center;
    padding-top: 56px; margin-bottom: 24px;
  }
  .today-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-secondary); border-radius: var(--radius-full);
    padding: 8px 14px; cursor: pointer;
  }
  .today-pill-text { font-size: 17px; font-weight: 600; color: var(--text-primary); }
  .today-pill-icon { color: var(--text-secondary); }

  /* edit-btn removed in v2 */

  /* Summary row — ring left, macros right */
  .summary-row {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 24px;
  }

  /* Ring — shows consumed / goal */
  .ring-wrap { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .ring-container { position: relative; width: 150px; height: 150px; }
  .ring-svg { width: 150px; height: 150px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--bg-tertiary); stroke-width: 12; }
  .ring-fill {
    fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round;
    stroke-dasharray: 408; stroke-dashoffset: 408;
    transition: stroke-dashoffset 800ms cubic-bezier(.4,0,.2,1), stroke 400ms;
  }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-consumed { font-size: 30px; font-weight: 700; letter-spacing: -1px; display: flex; align-items: center; gap: 4px; }
  .ring-goal { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .ring-remaining { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

  /* Macros — 2x2 grid */
  .macros { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; flex: 1; }
  .macro { display: flex; flex-direction: column; gap: 4px; }
  .macro-name { font-size: 13px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 4px; }
  .macro-name i { color: var(--text-secondary); }
  .bar-bg { width: 80%; height: 5px; background: var(--bg-tertiary); border-radius: var(--radius-full); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: var(--radius-full); width: 0%; transition: width 600ms cubic-bezier(.4,0,.2,1); }
  .bar-fill.protein { background: var(--protein); }
  .bar-fill.carbs { background: var(--carbs); }
  .bar-fill.fat { background: var(--fat); }
  .bar-fill.fibre { background: var(--fibre); }
  .macro-val { font-size: 12px; font-weight: 400; color: var(--text-tertiary); }

  /* Meals */
  .meals-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .meals-title { font-size: 20px; font-weight: 600; }

  /* Food cards with photo thumbnails */
  .food-card {
    background: var(--bg-secondary); border-radius: var(--radius-md);
    padding: 12px 14px; margin-bottom: 8px;
    animation: cardIn 300ms ease both;
  }
  .food-card:nth-child(2) { animation-delay: 60ms; }
  .food-card:nth-child(3) { animation-delay: 120ms; }
  .food-card:nth-child(4) { animation-delay: 180ms; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-row1 { display: flex; align-items: center; gap: 12px; }
  .food-thumb {
    width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
    object-fit: cover; background: var(--bg-tertiary);
  }
  .food-info { flex: 1; min-width: 0; }
  .fname { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fdetail { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
  .fdetail span + span { margin-left: 4px; }
  .fcals-col { flex-shrink: 0; text-align: right; }
  .fcals { font-size: 17px; font-weight: 700; }
  .fcals-unit { font-size: 12px; color: var(--text-secondary); }

  .pending-badge {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 2px;
  }
  .pending-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); }
  .pending-text { font-size: 12px; font-weight: 500; color: var(--warning); }

  /* FAB */
  .fab {
    position: absolute; bottom: 100px; right: 24px;
    width: 56px; height: 56px; background: var(--accent);
    border: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 2px 8px rgba(52,199,89,0.3);
    cursor: pointer; z-index: 9; transition: transform 100ms;
  }
  .fab:active { transform: scale(0.9); }

  /* Bottom Nav */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 83px; background: var(--bg-primary);
    border-top: 0.5px solid var(--bg-tertiary);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding-top: 6px; z-index: 10;
  }
  .nav-tab {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; cursor: pointer; padding: 4px 16px;
    color: var(--text-secondary);
  }
  .nav-tab.active { color: var(--accent); }
  .nav-label { font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
<div class="app-frame">
  <div class="screen">
    <div class="pad">
      <!-- Header: single pill -->
      <div class="header">
        <div class="today-pill">
          <i data-lucide="calendar" class="today-pill-icon" style="width:16px;height:16px"></i>
          <span class="today-pill-text">Today, May 25</span>
        </div>
      </div>

      <!-- Summary: ring left + macros right -->
      <div class="summary-row">
        <div class="ring-wrap">
          <div class="ring-container">
            <svg class="ring-svg" viewBox="0 0 150 150">
              <circle class="ring-bg" cx="75" cy="75" r="65"/>
              <circle class="ring-fill" id="ringFill" cx="75" cy="75" r="65"/>
            </svg>
            <div class="ring-center">
              <span class="ring-consumed">753 <svg width="16" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
              <span class="ring-goal">of 2,000 cal</span>
            </div>
          </div>
          <span class="ring-remaining">1,247 remaining</span>
        </div>

        <div class="macros">
          <div class="macro">
            <span class="macro-name">Protein<i data-lucide="drumstick" style="width:14px;height:14px"></i></span>
            <div class="bar-bg"><div class="bar-fill protein" id="barP"></div></div>
            <span class="macro-val">45g / 120g</span>
          </div>
          <div class="macro">
            <span class="macro-name">Carbs<i data-lucide="wheat" style="width:14px;height:14px"></i></span>
            <div class="bar-bg"><div class="bar-fill carbs" id="barC"></div></div>
            <span class="macro-val">82g / 250g</span>
          </div>
          <div class="macro">
            <span class="macro-name">Fat<i data-lucide="droplet" style="width:14px;height:14px"></i></span>
            <div class="bar-bg"><div class="bar-fill fat" id="barF"></div></div>
            <span class="macro-val">18g / 65g</span>
          </div>
          <div class="macro">
            <span class="macro-name">Fibre<i data-lucide="leaf" style="width:14px;height:14px"></i></span>
            <div class="bar-bg"><div class="bar-fill fibre" id="barFi"></div></div>
            <span class="macro-val">8g / 30g</span>
          </div>
        </div>
      </div>

      <!-- Meals -->
      <div class="meals-header">
        <span class="meals-title">Meals</span>
      </div>

      <div class="food-card">
        <div class="card-row1">
          <img class="food-thumb" src="https://images.unsplash.com/photo-1525351484163-7529414344d8?w=120&h=120&fit=crop&q=80" alt="Scrambled eggs">
          <div class="food-info">
            <div class="fname">Scrambled eggs</div>
            <div class="fdetail">
              <span>2 large eggs</span>
              <span>&middot;</span>
              <span>P:24</span> <span>C:2</span> <span>F:22</span> <span>Fi:0</span>
            </div>
          </div>
          <div class="fcals-col">
            <div class="fcals">320</div>
            <div class="fcals-unit">cal</div>
          </div>
        </div>
      </div>

      <div class="food-card">
        <div class="card-row1">
          <img class="food-thumb" src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=120&h=120&fit=crop&q=80" alt="Toast">
          <div class="food-info">
            <div class="fname">Toast with butter</div>
            <div class="fdetail">
              <span>1 slice</span>
              <span>&middot;</span>
              <span>P:4</span> <span>C:24</span> <span>F:8</span> <span>Fi:1</span>
            </div>
          </div>
          <div class="fcals-col">
            <div class="fcals">185</div>
            <div class="fcals-unit">cal</div>
          </div>
        </div>
      </div>

      <div class="food-card">
        <div class="card-row1">
          <img class="food-thumb" src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=120&h=120&fit=crop&q=80" alt="Banana">
          <div class="food-info">
            <div class="fname">Banana</div>
            <div class="fdetail">
              <span>1 medium</span>
              <span>&middot;</span>
              <span>P:1</span> <span>C:27</span> <span>F:0</span> <span>Fi:3</span>
            </div>
          </div>
          <div class="fcals-col">
            <div class="fcals">105</div>
            <div class="fcals-unit">cal</div>
          </div>
        </div>
      </div>

      <div class="food-card">
        <div class="card-row1">
          <img class="food-thumb" src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=120&h=120&fit=crop&q=80" alt="Chicken pasta">
          <div class="food-info">
            <div class="fname">Chicken pasta</div>
            <div class="pending-badge">
              <span class="pending-dot"></span>
              <span class="pending-text">Processing</span>
            </div>
          </div>
          <div class="fcals-col">
            <div class="fcals" style="color:var(--text-tertiary)">—</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="fab"><i data-lucide="plus" style="width:24px;height:24px"></i></button>

  <nav class="bottom-nav">
    <button class="nav-tab active">
      <i data-lucide="house" style="width:24px;height:24px"></i>
      <span class="nav-label">Today</span>
    </button>
    <button class="nav-tab">
      <i data-lucide="calendar-days" style="width:24px;height:24px"></i>
      <span class="nav-label">History</span>
    </button>
    <button class="nav-tab">
      <i data-lucide="settings" style="width:24px;height:24px"></i>
      <span class="nav-label">Settings</span>
    </button>
  </nav>
</div>
<script>
  lucide.createIcons();

  const calories = { value: 753, target: 2000 };
  const macros = [
    { id: 'barP', value: 45, target: 120 },
    { id: 'barC', value: 82, target: 250 },
    { id: 'barF', value: 18, target: 65 },
    { id: 'barFi', value: 8, target: 30 }
  ];

  const lightGreen = '#A8E6CF';
  const red = '#FF3B30';
  const yellow = '#FF9500';
  const green = '#34C759';

  function getBarColor(value, target) {
    const ratio = value / target;
    if (ratio < 0.8 || ratio > 1.1) return red;
    if (ratio < 0.9) return yellow;
    return green;
  }

  const calRatio = calories.value / calories.target;
  const colorsActive = calRatio >= 0.8;

  // Calorie ring
  const circ = 2 * Math.PI * 65;
  const ring = document.getElementById('ringFill');
  ring.style.strokeDasharray = circ;
  const ringColor = colorsActive ? getBarColor(calories.value, calories.target) : lightGreen;
  ring.style.stroke = ringColor;
  requestAnimationFrame(() => { ring.style.strokeDashoffset = circ * (1 - calRatio); });

  // Macro bars
  macros.forEach((m, i) => {
    const bar = document.getElementById(m.id);
    const pct = (m.value / m.target * 100) + '%';
    const color = colorsActive ? getBarColor(m.value, m.target) : lightGreen;
    bar.style.background = color;
    setTimeout(() => { bar.style.width = pct; }, 100 + i * 100);
  });
</script>
</body>
</html>
