<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthMate — History</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #F2F2F7;
    --bg-tertiary: #E5E5EA;
    --text-primary: #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary: #AEAEB2;
    --accent: #34C759;
    --accent-secondary: #007AFF;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-full: 999px;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-secondary);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex; justify-content: center;
  }
  .app-frame {
    width: 100%; max-width: 428px; min-height: 100dvh;
    background: var(--bg-primary);
    position: relative; overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
  }
  .screen { position: absolute; inset: 0; overflow-y: auto; }
  .screen::-webkit-scrollbar { display: none; }
  .screen { scrollbar-width: none; }
  .pad { padding: 0 16px; padding-bottom: 120px; }

  .header { padding-top: 56px; margin-bottom: 20px; }
  .header-title { font-size: 28px; font-weight: 700; }

  .month-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-bottom: 16px;
  }
  .month-arrow {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; border-radius: 50%; transition: background 150ms;
  }
  .month-arrow:hover { background: var(--bg-secondary); }
  .month-label { font-size: 17px; font-weight: 600; }

  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 0; margin-bottom: 20px;
  }
  .cal-header {
    text-align: center; padding: 4px 0 8px;
    font-size: 12px; font-weight: 500; color: var(--text-secondary);
  }
  .cal-day {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 44px; position: relative; cursor: pointer;
    border-radius: 50%; font-size: 15px; color: var(--text-primary);
    border: none; background: none; font-family: inherit;
  }
  .cal-day.empty { pointer-events: none; }
  .cal-day.today { color: var(--accent); font-weight: 600; }
  .cal-day.selected { background: rgba(52,199,89,0.12); font-weight: 600; }
  .cal-dot {
    position: absolute; bottom: 4px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }

  .detail-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .detail-cal { font-size: 17px; color: var(--text-secondary); margin-bottom: 16px; }

  .food-card {
    background: var(--bg-secondary); border-radius: var(--radius-md);
    padding: 14px 16px; margin-bottom: 8px;
  }
  .card-row1 { display: flex; align-items: center; gap: 10px; }
  .emoji { font-size: 24px; width: 32px; text-align: center; flex-shrink: 0; }
  .fname { font-size: 17px; font-weight: 600; flex: 1; }
  .fcals { font-size: 17px; font-weight: 600; flex-shrink: 0; }
  .card-row2 { display: flex; justify-content: space-between; margin-top: 4px; padding-left: 42px; }
  .fserving { font-size: 13px; color: var(--text-secondary); }
  .fmacros { font-size: 13px; color: var(--text-secondary); }
  .fmacros span + span { margin-left: 6px; }

  .fab {
    position: absolute; bottom: 100px; right: 24px;
    width: 56px; height: 56px; background: var(--accent);
    border: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 2px 8px rgba(52,199,89,0.3);
    cursor: pointer; z-index: 9;
  }
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 83px; background: var(--bg-primary);
    border-top: 0.5px solid var(--bg-tertiary);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding-top: 6px; z-index: 10;
  }
  .nav-tab {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; cursor: pointer; padding: 4px 16px;
    color: var(--text-secondary);
  }
  .nav-tab.active { color: var(--accent); }
  .nav-label { font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
<div class="app-frame">
  <div class="screen">
    <div class="pad">
      <div class="header">
        <div class="header-title">History</div>
      </div>

      <div class="month-nav">
        <button class="month-arrow"><i data-lucide="chevron-left" style="width:20px;height:20px"></i></button>
        <span class="month-label">May 2025</span>
        <button class="month-arrow"><i data-lucide="chevron-right" style="width:20px;height:20px"></i></button>
      </div>

      <div class="cal-grid" id="calGrid">
        <span class="cal-header">Mo</span>
        <span class="cal-header">Tu</span>
        <span class="cal-header">We</span>
        <span class="cal-header">Th</span>
        <span class="cal-header">Fr</span>
        <span class="cal-header">Sa</span>
        <span class="cal-header">Su</span>
      </div>

      <div id="dayDetail">
        <div class="detail-title" id="detailTitle">Sunday, May 25</div>
        <div class="detail-cal" id="detailCal">753 / 2,000 cal</div>

        <div class="food-card">
          <div class="card-row1">
            <span class="emoji">🍳</span>
            <span class="fname">Scrambled eggs</span>
            <span class="fcals">320</span>
          </div>
          <div class="card-row2">
            <span class="fserving">2 large eggs</span>
            <span class="fmacros"><span>P:24</span><span>C:2</span><span>F:22</span></span>
          </div>
        </div>
        <div class="food-card">
          <div class="card-row1">
            <span class="emoji">🍞</span>
            <span class="fname">Toast with butter</span>
            <span class="fcals">185</span>
          </div>
          <div class="card-row2">
            <span class="fserving">1 slice</span>
            <span class="fmacros"><span>P:4</span><span>C:24</span><span>F:8</span></span>
          </div>
        </div>
        <div class="food-card">
          <div class="card-row1">
            <span class="emoji">🍌</span>
            <span class="fname">Banana</span>
            <span class="fcals">105</span>
          </div>
          <div class="card-row2">
            <span class="fserving">1 medium</span>
            <span class="fmacros"><span>P:1</span><span>C:27</span><span>F:0</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="fab"><i data-lucide="plus" style="width:24px;height:24px"></i></button>

  <nav class="bottom-nav">
    <button class="nav-tab">
      <i data-lucide="house" style="width:24px;height:24px"></i>
      <span class="nav-label">Today</span>
    </button>
    <button class="nav-tab active">
      <i data-lucide="calendar-days" style="width:24px;height:24px"></i>
      <span class="nav-label">History</span>
    </button>
    <button class="nav-tab">
      <i data-lucide="settings" style="width:24px;height:24px"></i>
      <span class="nav-label">Settings</span>
    </button>
  </nav>
</div>
<script>
  lucide.createIcons();

  const grid = document.getElementById('calGrid');
  const year = 2025, month = 4;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const logged = [1, 3, 5, 8, 10, 12, 15, 18, 20, 22, 24, 25];

  for (let i = 0; i < startOffset; i++) {
    const c = document.createElement('button');
    c.className = 'cal-day empty';
    grid.appendChild(c);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const c = document.createElement('button');
    c.className = 'cal-day';
    if (d === 25) c.classList.add('today', 'selected');
    c.innerHTML = d;
    if (logged.includes(d)) c.innerHTML += '<span class="cal-dot"></span>';
    c.addEventListener('click', () => {
      grid.querySelectorAll('.cal-day').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected');
      const names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const dt = new Date(year, month, d);
      document.getElementById('detailTitle').textContent = names[dt.getDay()] + ', May ' + d;
      if (logged.includes(d)) {
        const cals = Math.floor(800 + Math.random() * 1200);
        document.getElementById('detailCal').textContent = cals.toLocaleString() + ' / 2,000 cal';
      } else {
        document.getElementById('detailCal').textContent = 'No meals logged';
      }
    });
    grid.appendChild(c);
  }
  const total = startOffset + daysInMonth;
  const rem = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 0; i < rem; i++) {
    const c = document.createElement('button');
    c.className = 'cal-day empty';
    grid.appendChild(c);
  }
</script>
</body>
</html>
