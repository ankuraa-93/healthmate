<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthMate — Auth</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #F2F2F7;
    --bg-tertiary: #E5E5EA;
    --text-primary: #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary: #AEAEB2;
    --accent: #34C759;
    --accent-secondary: #007AFF;
    --destructive: #FF3B30;
    --radius-sm: 8px;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-secondary);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }
  .app-frame {
    width: 100%; max-width: 428px; min-height: 100dvh;
    background: var(--bg-primary);
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 32px;
  }
  .auth-icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--accent), #2DB84D);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(52,199,89,0.25);
  }
  .title { font-size: 28px; font-weight: 700; margin-bottom: 4px; color: var(--text-primary); }
  .tagline { font-size: 16px; color: var(--text-secondary); margin-bottom: 36px; }
  .form { width: 100%; max-width: 340px; }
  .input {
    width: 100%; background: var(--bg-secondary); border: none;
    border-radius: var(--radius-sm); padding: 14px 16px;
    font-family: inherit; font-size: 17px; color: var(--text-primary); outline: none;
    transition: box-shadow 200ms;
  }
  .input::placeholder { color: var(--text-tertiary); }
  .input:focus { box-shadow: 0 0 0 2px rgba(52,199,89,0.3); }
  .input + .input { margin-top: 8px; }
  .confirm-pw { display: none; margin-top: 8px; }
  .form.signup .confirm-pw { display: block; }
  .btn {
    width: 100%; height: 50px; margin-top: 16px;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-sm); font-family: inherit;
    font-size: 17px; font-weight: 600; cursor: pointer;
    transition: transform 100ms;
  }
  .btn:active { transform: scale(0.97); }
  .toggle {
    margin-top: 20px; font-size: 15px;
    color: var(--text-secondary); text-align: center;
  }
  .toggle span {
    color: var(--accent-secondary); cursor: pointer; font-weight: 500;
  }
</style>
</head>
<body>
<div class="app-frame">
  <div class="auth-icon">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/></svg>
  </div>
  <div class="title">HealthMate</div>
  <div class="tagline">Track what you eat</div>
  <form class="form" id="authForm" onsubmit="return false;">
    <input class="input" type="email" placeholder="Email">
    <input class="input" type="password" placeholder="Password">
    <input class="input confirm-pw" type="password" placeholder="Confirm password">
    <button class="btn" id="authBtn" onclick="alert('Sign in clicked!')">Sign In</button>
  </form>
  <div class="toggle">
    <span id="toggleLabel">Don't have an account?</span>
    <span id="toggleAction" onclick="toggleMode()">Sign Up</span>
  </div>
</div>
<script>
  let signup = false;
  function toggleMode() {
    signup = !signup;
    document.getElementById('authForm').classList.toggle('signup', signup);
    document.getElementById('authBtn').textContent = signup ? 'Sign Up' : 'Sign In';
    document.getElementById('toggleLabel').textContent = signup ? 'Already have an account?' : "Don't have an account?";
    document.getElementById('toggleAction').textContent = signup ? 'Sign In' : 'Sign Up';
  }
</script>
</body>
</html>
