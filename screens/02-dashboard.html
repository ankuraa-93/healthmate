<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthMate — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #F2F2F7;
    --bg-tertiary: #E5E5EA;
    --text-primary: #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary: #AEAEB2;
    --accent: #34C759;
    --accent-secondary: #007AFF;
    --warning: #FF9500;
    --destructive: #FF3B30;
    --protein: #5E5CE6;
    --carbs: #FF9F0A;
    --fat: #FF375F;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-full: 999px;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-secondary);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex; justify-content: center;
  }
  .app-frame {
    width: 100%; max-width: 428px; min-height: 100dvh;
    background: var(--bg-primary);
    position: relative; overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
  }
  .screen { position: absolute; inset: 0; overflow-y: auto; }
  .screen::-webkit-scrollbar { display: none; }
  .screen { scrollbar-width: none; }
  .pad { padding: 0 16px; padding-bottom: 120px; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 56px; margin-bottom: 24px;
  }
  .header-title { font-size: 28px; font-weight: 700; }
  .date-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-secondary); border-radius: var(--radius-full);
    padding: 6px 12px;
  }
  .date-chip-text { font-size: 15px; color: var(--text-secondary); }

  /* Ring */
  .ring-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 12px; }
  .ring-container { position: relative; width: 170px; height: 170px; }
  .ring-svg { width: 170px; height: 170px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--bg-tertiary); stroke-width: 12; }
  .ring-fill {
    fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round;
    stroke-dasharray: 440; stroke-dashoffset: 440;
    transition: stroke-dashoffset 800ms cubic-bezier(.4,0,.2,1), stroke 400ms;
  }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-number { font-size: 34px; font-weight: 700; letter-spacing: -1px; }
  .ring-label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

  .eaten-goal {
    text-align: center; color: var(--text-secondary);
    display: flex; gap: 24px; justify-content: center;
    margin-bottom: 24px; font-size: 15px;
  }

  /* Macros */
  .macros { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .macro { display: flex; flex-direction: column; gap: 6px; }
  .macro-name { font-size: 15px; color: var(--text-secondary); }
  .macro-val { font-size: 14px; font-weight: 600; }
  .bar-bg { width: 100%; height: 8px; background: var(--bg-tertiary); border-radius: var(--radius-full); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: var(--radius-full); width: 0%; transition: width 600ms cubic-bezier(.4,0,.2,1); }
  .bar-fill.protein { background: var(--protein); }
  .bar-fill.carbs { background: var(--carbs); }
  .bar-fill.fat { background: var(--fat); }

  /* Meals */
  .meals-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .meals-title { font-size: 20px; font-weight: 600; }
  .meals-edit { color: var(--accent-secondary); font-size: 17px; background: none; border: none; cursor: pointer; }

  .food-card {
    background: var(--bg-secondary); border-radius: var(--radius-md);
    padding: 14px 16px; margin-bottom: 8px;
    animation: cardIn 300ms ease both;
  }
  .food-card:nth-child(2) { animation-delay: 60ms; }
  .food-card:nth-child(3) { animation-delay: 120ms; }
  .food-card:nth-child(4) { animation-delay: 180ms; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-row1 { display: flex; align-items: center; gap: 10px; }
  .emoji { font-size: 24px; width: 32px; text-align: center; flex-shrink: 0; }
  .fname { font-size: 17px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fcals { font-size: 17px; font-weight: 600; flex-shrink: 0; }
  .card-row2 { display: flex; justify-content: space-between; margin-top: 4px; padding-left: 42px; }
  .fserving { font-size: 13px; color: var(--text-secondary); }
  .fmacros { font-size: 13px; color: var(--text-secondary); }
  .fmacros span + span { margin-left: 6px; }
  .pending-badge { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; margin-left: 42px; }
  .pending-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); }
  .pending-text { font-size: 12px; font-weight: 500; color: var(--warning); }

  /* FAB */
  .fab {
    position: absolute; bottom: 100px; right: 24px;
    width: 56px; height: 56px; background: var(--accent);
    border: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 2px 8px rgba(52,199,89,0.3);
    cursor: pointer; z-index: 9; transition: transform 100ms;
  }
  .fab:active { transform: scale(0.9); }

  /* Bottom Nav */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 83px; background: var(--bg-primary);
    border-top: 0.5px solid var(--bg-tertiary);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding-top: 6px; z-index: 10;
  }
  .nav-tab {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; cursor: pointer; padding: 4px 16px;
    color: var(--text-secondary);
  }
  .nav-tab.active { color: var(--accent); }
  .nav-label { font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
<div class="app-frame">
  <div class="screen">
    <div class="pad">
      <div class="header">
        <div class="header-title">Today</div>
        <div class="date-chip">
          <i data-lucide="calendar" style="width:16px;height:16px;color:var(--text-secondary)"></i>
          <span class="date-chip-text">Sun, May 25</span>
        </div>
      </div>

      <div class="ring-wrap">
        <div class="ring-container">
          <svg class="ring-svg" viewBox="0 0 170 170">
            <circle class="ring-bg" cx="85" cy="85" r="70"/>
            <circle class="ring-fill" id="ringFill" cx="85" cy="85" r="70"/>
          </svg>
          <div class="ring-center">
            <span class="ring-number">1,247</span>
            <span class="ring-label">remaining</span>
          </div>
        </div>
      </div>

      <div class="eaten-goal">
        <span>Eaten: <strong>753</strong></span>
        <span>Goal: <strong>2,000</strong></span>
      </div>

      <div class="macros">
        <div class="macro">
          <span class="macro-name">Protein</span>
          <span class="macro-val">45 / 120g</span>
          <div class="bar-bg"><div class="bar-fill protein" id="barP"></div></div>
        </div>
        <div class="macro">
          <span class="macro-name">Carbs</span>
          <span class="macro-val">82 / 250g</span>
          <div class="bar-bg"><div class="bar-fill carbs" id="barC"></div></div>
        </div>
        <div class="macro">
          <span class="macro-name">Fat</span>
          <span class="macro-val">18 / 65g</span>
          <div class="bar-bg"><div class="bar-fill fat" id="barF"></div></div>
        </div>
      </div>

      <div class="meals-header">
        <span class="meals-title">Meals</span>
        <button class="meals-edit">Edit</button>
      </div>

      <div class="food-card">
        <div class="card-row1">
          <span class="emoji">🍳</span>
          <span class="fname">Scrambled eggs</span>
          <span class="fcals">320</span>
        </div>
        <div class="card-row2">
          <span class="fserving">2 large eggs</span>
          <span class="fmacros"><span>P:24</span><span>C:2</span><span>F:22</span></span>
        </div>
      </div>

      <div class="food-card">
        <div class="card-row1">
          <span class="emoji">🍞</span>
          <span class="fname">Toast with butter</span>
          <span class="fcals">185</span>
        </div>
        <div class="card-row2">
          <span class="fserving">1 slice</span>
          <span class="fmacros"><span>P:4</span><span>C:24</span><span>F:8</span></span>
        </div>
      </div>

      <div class="food-card">
        <div class="card-row1">
          <span class="emoji">🍌</span>
          <span class="fname">Banana</span>
          <span class="fcals">105</span>
        </div>
        <div class="card-row2">
          <span class="fserving">1 medium</span>
          <span class="fmacros"><span>P:1</span><span>C:27</span><span>F:0</span></span>
        </div>
      </div>

      <div class="food-card">
        <div class="card-row1">
          <span class="emoji">🍝</span>
          <span class="fname">Chicken pasta</span>
          <span class="fcals">143</span>
        </div>
        <div class="pending-badge">
          <span class="pending-dot"></span>
          <span class="pending-text">Pending</span>
        </div>
      </div>
    </div>
  </div>

  <button class="fab"><i data-lucide="plus" style="width:24px;height:24px"></i></button>

  <nav class="bottom-nav">
    <button class="nav-tab active">
      <i data-lucide="house" style="width:24px;height:24px"></i>
      <span class="nav-label">Today</span>
    </button>
    <button class="nav-tab">
      <i data-lucide="calendar-days" style="width:24px;height:24px"></i>
      <span class="nav-label">History</span>
    </button>
    <button class="nav-tab">
      <i data-lucide="settings" style="width:24px;height:24px"></i>
      <span class="nav-label">Settings</span>
    </button>
  </nav>
</div>
<script>
  lucide.createIcons();
  const circ = 2 * Math.PI * 70;
  const pct = 753 / 2000;
  const ring = document.getElementById('ringFill');
  ring.style.strokeDasharray = circ;
  requestAnimationFrame(() => { ring.style.strokeDashoffset = circ * (1 - pct); });
  setTimeout(() => { document.getElementById('barP').style.width = (45/120*100)+'%'; }, 100);
  setTimeout(() => { document.getElementById('barC').style.width = (82/250*100)+'%'; }, 200);
  setTimeout(() => { document.getElementById('barF').style.width = (18/65*100)+'%'; }, 300);
</script>
</body>
</html>
