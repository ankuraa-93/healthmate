<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthMate — Confirm Food</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #F2F2F7;
    --bg-tertiary: #E5E5EA;
    --text-primary: #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary: #AEAEB2;
    --accent: #34C759;
    --accent-secondary: #007AFF;
    --destructive: #FF3B30;
    --warning: #FF9500;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 999px;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-secondary);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex; justify-content: center;
  }
  .app-frame {
    width: 100%; max-width: 428px; min-height: 100dvh;
    background: rgba(0,0,0,0.3);
    position: relative; overflow: hidden;
  }

  /* Sheet */
  .sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--bg-primary);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    display: flex; flex-direction: column;
    max-height: 92vh;
  }
  .handle {
    width: 36px; height: 4px;
    background: var(--bg-tertiary);
    border-radius: var(--radius-full);
    margin: 10px auto 0;
    flex-shrink: 0;
  }

  /* Header */
  .sheet-header {
    display: flex; align-items: center;
    padding: 16px 24px 0;
    flex-shrink: 0;
  }
  .back-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg-secondary); border: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-primary); cursor: pointer;
    transition: background 150ms;
    flex-shrink: 0;
  }
  .back-btn:active { background: var(--bg-tertiary); }
  .sheet-title {
    font-size: 22px; font-weight: 600;
    margin-left: 12px; flex: 1;
  }

  /* Original query text */
  .original-query {
    margin: 12px 24px 0;
    font-size: 14px;
    color: var(--text-tertiary);
    line-height: 1.4;
  }

  /* Scrollable body */
  .sheet-body {
    flex: 1; overflow-y: auto;
    padding: 20px 24px 0;
  }
  .sheet-body::-webkit-scrollbar { display: none; }
  .sheet-body { scrollbar-width: none; }

  /* Meal type section header — dashboard style */
  .meal-section { margin-bottom: 16px; }
  .meal-section:last-child { margin-bottom: 8px; }
  .meal-label {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.3px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 0.5px solid var(--bg-tertiary);
  }

  /* Food item cards */
  .food-items { display: flex; flex-direction: column; gap: 10px; }

  .food-card {
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    position: relative;
    cursor: pointer;
    transition: opacity 300ms, transform 300ms;
  }
  .food-card.removing {
    opacity: 0; transform: scale(0.95) translateX(20px);
  }

  /* Top row: thumb + name/macros + calories + chevron */
  .card-row1 {
    display: flex; align-items: center; gap: 12px;
  }
  .food-thumb {
    width: 44px; height: 44px; border-radius: 10px;
    object-fit: cover; background: var(--bg-tertiary); flex-shrink: 0;
  }
  .food-info { flex: 1; min-width: 0; }
  .fname {
    font-size: 16px; font-weight: 600; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fdetail {
    font-size: 13px; color: var(--text-secondary); margin-top: 1px;
  }
  .fdetail span + span { margin-left: 4px; }
  .fcals-col { flex-shrink: 0; text-align: right; }
  .fcals { font-size: 17px; font-weight: 700; }
  .fcals-unit { font-size: 12px; color: var(--text-secondary); }

  .chevron {
    flex-shrink: 0; color: var(--text-tertiary);
    transition: transform 250ms ease;
    display: flex; align-items: center;
  }
  .food-card.expanded .chevron { transform: rotate(90deg); }

  /* Expandable edit area — hidden by default */
  .card-expand {
    max-height: 0; overflow: hidden;
    transition: max-height 250ms ease, opacity 200ms ease;
    opacity: 0;
  }
  .food-card.expanded .card-expand {
    max-height: 180px;
    opacity: 1;
  }

  .expand-content {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 0.5px solid var(--bg-tertiary);
  }

  /* Quantity section label */
  .qty-section-label {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.3px;
    margin-bottom: 8px;
  }

  /* Wide quantity input bar + trash — matches EditFoodSheet */
  .qty-input-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .qty-input-bar {
    flex: 1; display: flex; align-items: center;
    background: var(--bg-primary);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    transition: box-shadow 200ms;
  }
  .qty-input-bar:focus-within {
    box-shadow: 0 0 0 2px rgba(52,199,89,0.25);
  }
  .qty-input {
    flex: 1; background: none; border: none;
    font-family: inherit; font-size: 17px; font-weight: 600;
    color: var(--text-primary);
    text-align: right; outline: none;
    -moz-appearance: textfield;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .qty-input-unit {
    font-size: 15px; color: var(--text-secondary); margin-left: 6px;
  }
  .delete-btn {
    width: 44px; height: 44px; border-radius: var(--radius-md);
    background: var(--bg-primary); border: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-tertiary); cursor: pointer; flex-shrink: 0;
    transition: color 150ms, background 150ms;
  }
  .delete-btn:hover { color: var(--destructive); background: rgba(255,59,48,0.1); }
  .delete-btn:active { color: var(--destructive); background: rgba(255,59,48,0.15); }

  /* ± adjustment pills */
  .qty-pills {
    display: flex; gap: 8px;
  }
  .qty-pill {
    flex: 1; padding: 7px 0;
    background: var(--bg-primary); border: none;
    border-radius: var(--radius-full);
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--text-secondary); cursor: pointer;
    transition: background 150ms, color 150ms;
  }
  .qty-pill:hover { background: var(--bg-tertiary); }
  .qty-pill:active { background: var(--bg-tertiary); color: var(--text-primary); }

  /* Summary bar */
  .summary-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0;
    margin-top: 8px;
    border-top: 0.5px solid var(--bg-tertiary);
  }
  .summary-label {
    font-size: 14px; color: var(--text-secondary); font-weight: 500;
  }
  .summary-value {
    font-size: 18px; font-weight: 700; color: var(--text-primary);
  }
  .summary-value span {
    font-size: 14px; font-weight: 400; color: var(--text-secondary);
  }

  /* Bottom action area */
  .action-bar {
    flex-shrink: 0;
    padding: 12px 24px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    border-top: 0.5px solid var(--bg-tertiary);
    background: var(--bg-primary);
  }
  .confirm-btn {
    width: 100%; height: 50px;
    background: var(--accent); border: none;
    border-radius: var(--radius-sm);
    font-family: inherit; font-size: 17px; font-weight: 600;
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 100ms, opacity 200ms;
  }
  .confirm-btn:active { transform: scale(0.98); }
  .confirm-btn:disabled { opacity: 0.4; cursor: default; }
  .confirm-btn:disabled:active { transform: none; }

  /* Loading state */
  .loading-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 24px;
  }
  .loading-spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--bg-tertiary);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    margin-top: 14px;
    font-size: 15px; color: var(--text-secondary);
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-primary); color: #fff;
    padding: 12px 20px; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 500; opacity: 0;
    pointer-events: none; transition: opacity 200ms, transform 200ms;
    white-space: nowrap; z-index: 30;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Animations for card entry */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .food-card { animation: slideUp 300ms ease-out both; }
  .meal-section:nth-child(1) .food-card:nth-child(1) { animation-delay: 0ms; }
  .meal-section:nth-child(1) .food-card:nth-child(2) { animation-delay: 80ms; }
  .meal-section:nth-child(1) .food-card:nth-child(3) { animation-delay: 160ms; }
  .meal-section:nth-child(2) .food-card:nth-child(1) { animation-delay: 240ms; }
</style>
</head>
<body>
<div class="app-frame">
  <div class="sheet" id="sheet">
    <div class="handle"></div>

    <!-- Header -->
    <div class="sheet-header">
      <button class="back-btn" onclick="goBack()">
        <i data-lucide="chevron-left" style="width:18px;height:18px"></i>
      </button>
      <div class="sheet-title">Confirm Items</div>
    </div>

    <!-- Original query -->
    <div class="original-query">2 eggs and toast with butter</div>

    <!-- Loading state (shown briefly, then replaced by results) -->
    <div class="loading-state" id="loadingState" style="display:none;">
      <div class="loading-spinner"></div>
      <div class="loading-text">Parsing your food...</div>
    </div>

    <!-- Parsed results -->
    <div class="sheet-body" id="resultsBody">

      <!-- Breakfast section -->
      <div class="meal-section" id="section-breakfast">
        <div class="meal-label">Breakfast</div>
        <div class="food-items">

          <!-- Item 1: Eggs -->
          <div class="food-card" id="card-1" onclick="toggleExpand(this, event)">
            <div class="card-row1">
              <img class="food-thumb" src="https://images.unsplash.com/photo-1525351484163-7529414344d8?w=120&h=120&fit=crop&q=80" alt="">
              <div class="food-info">
                <div class="fname">Egg, boiled</div>
                <div class="fdetail">
                  <span id="qty-text-1">120g</span>
                  <span>&middot;</span>
                  <span>P:<span id="p-1">16</span></span>
                  <span>C:<span id="c-1">1</span></span>
                  <span>F:<span id="f-1">13</span></span>
                  <span>Fi:<span id="fibre-1">0</span></span>
                </div>
              </div>
              <div class="fcals-col">
                <div class="fcals" id="cal-1">186</div>
                <div class="fcals-unit">cal</div>
              </div>
              <div class="chevron">
                <i data-lucide="chevron-right" style="width:16px;height:16px"></i>
              </div>
            </div>
            <div class="card-expand">
              <div class="expand-content">
                <div class="qty-section-label">Quantity</div>
                <div class="qty-input-row">
                  <div class="qty-input-bar">
                    <input class="qty-input" id="qty-input-1" type="text" inputmode="numeric" value="120" onclick="event.stopPropagation()" oninput="onQtyInput('1')">
                    <span class="qty-input-unit">g</span>
                  </div>
                  <button class="delete-btn" onclick="removeCard('1', event)">
                    <i data-lucide="trash-2" style="width:18px;height:18px"></i>
                  </button>
                </div>
                <div class="qty-pills">
                  <button class="qty-pill" onclick="adjustQty('1', -50, event)">−50g</button>
                  <button class="qty-pill" onclick="adjustQty('1', -10, event)">−10g</button>
                  <button class="qty-pill" onclick="adjustQty('1', +10, event)">+10g</button>
                  <button class="qty-pill" onclick="adjustQty('1', +50, event)">+50g</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Item 2: Toast -->
          <div class="food-card" id="card-2" onclick="toggleExpand(this, event)">
            <div class="card-row1">
              <img class="food-thumb" src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=120&h=120&fit=crop&q=80" alt="">
              <div class="food-info">
                <div class="fname">Toast, white bread</div>
                <div class="fdetail">
                  <span id="qty-text-2">30g</span>
                  <span>&middot;</span>
                  <span>P:<span id="p-2">3</span></span>
                  <span>C:<span id="c-2">15</span></span>
                  <span>F:<span id="f-2">1</span></span>
                  <span>Fi:<span id="fibre-2">1</span></span>
                </div>
              </div>
              <div class="fcals-col">
                <div class="fcals" id="cal-2">80</div>
                <div class="fcals-unit">cal</div>
              </div>
              <div class="chevron">
                <i data-lucide="chevron-right" style="width:16px;height:16px"></i>
              </div>
            </div>
            <div class="card-expand">
              <div class="expand-content">
                <div class="qty-section-label">Quantity</div>
                <div class="qty-input-row">
                  <div class="qty-input-bar">
                    <input class="qty-input" id="qty-input-2" type="text" inputmode="numeric" value="30" onclick="event.stopPropagation()" oninput="onQtyInput('2')">
                    <span class="qty-input-unit">g</span>
                  </div>
                  <button class="delete-btn" onclick="removeCard('2', event)">
                    <i data-lucide="trash-2" style="width:18px;height:18px"></i>
                  </button>
                </div>
                <div class="qty-pills">
                  <button class="qty-pill" onclick="adjustQty('2', -50, event)">−50g</button>
                  <button class="qty-pill" onclick="adjustQty('2', -10, event)">−10g</button>
                  <button class="qty-pill" onclick="adjustQty('2', +10, event)">+10g</button>
                  <button class="qty-pill" onclick="adjustQty('2', +50, event)">+50g</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Item 3: Butter -->
          <div class="food-card" id="card-3" onclick="toggleExpand(this, event)">
            <div class="card-row1">
              <img class="food-thumb" src="https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=120&h=120&fit=crop&q=80" alt="">
              <div class="food-info">
                <div class="fname">Butter</div>
                <div class="fdetail">
                  <span id="qty-text-3">10g</span>
                  <span>&middot;</span>
                  <span>P:<span id="p-3">0</span></span>
                  <span>C:<span id="c-3">0</span></span>
                  <span>F:<span id="f-3">8</span></span>
                  <span>Fi:<span id="fibre-3">0</span></span>
                </div>
              </div>
              <div class="fcals-col">
                <div class="fcals" id="cal-3">72</div>
                <div class="fcals-unit">cal</div>
              </div>
              <div class="chevron">
                <i data-lucide="chevron-right" style="width:16px;height:16px"></i>
              </div>
            </div>
            <div class="card-expand">
              <div class="expand-content">
                <div class="qty-section-label">Quantity</div>
                <div class="qty-input-row">
                  <div class="qty-input-bar">
                    <input class="qty-input" id="qty-input-3" type="text" inputmode="numeric" value="10" onclick="event.stopPropagation()" oninput="onQtyInput('3')">
                    <span class="qty-input-unit">g</span>
                  </div>
                  <button class="delete-btn" onclick="removeCard('3', event)">
                    <i data-lucide="trash-2" style="width:18px;height:18px"></i>
                  </button>
                </div>
                <div class="qty-pills">
                  <button class="qty-pill" onclick="adjustQty('3', -50, event)">−50g</button>
                  <button class="qty-pill" onclick="adjustQty('3', -10, event)">−10g</button>
                  <button class="qty-pill" onclick="adjustQty('3', +10, event)">+10g</button>
                  <button class="qty-pill" onclick="adjustQty('3', +50, event)">+50g</button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Summary -->
      <div class="summary-bar" id="summaryBar">
        <div class="summary-label">Total</div>
        <div class="summary-value"><span id="totalCal">338</span> <span>cal</span></div>
      </div>
    </div>

    <!-- Confirm button -->
    <div class="action-bar" id="actionBar">
      <button class="confirm-btn" id="confirmBtn" onclick="confirmLog()">
        <i data-lucide="check" style="width:20px;height:20px"></i>
        Log 3 Items
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  lucide.createIcons();

  const foods = {
    '1': { cal: 155, p: 13, c: 1, f: 11, fibre: 0, qty: 120, unit: 'g' },
    '2': { cal: 265, p: 9, c: 49, f: 3, fibre: 2, qty: 30, unit: 'g' },
    '3': { cal: 717, p: 1, c: 0, f: 81, fibre: 0, qty: 10, unit: 'g' },
  };

  function toggleExpand(card, e) {
    if (e.target.closest('.qty-pill') || e.target.closest('.delete-btn') || e.target.closest('.qty-input') || e.target.closest('.qty-input-bar')) return;
    card.classList.toggle('expanded');
  }

  function adjustQty(id, delta, e) {
    e.stopPropagation();
    const food = foods[id];
    food.qty = Math.max(1, food.qty + delta);
    document.getElementById('qty-input-' + id).value = food.qty;
    renderCard(id);
    updateTotal();
  }

  function onQtyInput(id) {
    const input = document.getElementById('qty-input-' + id);
    const val = parseInt(input.value) || 0;
    foods[id].qty = Math.max(1, val);
    renderCard(id);
    updateTotal();
  }

  function renderCard(id) {
    const food = foods[id];
    const ratio = food.qty / 100;
    document.getElementById('qty-text-' + id).textContent = food.qty + food.unit;
    document.getElementById('cal-' + id).textContent = Math.round(food.cal * ratio);
    document.getElementById('p-' + id).textContent = Math.round(food.p * ratio);
    document.getElementById('c-' + id).textContent = Math.round(food.c * ratio);
    document.getElementById('f-' + id).textContent = Math.round(food.f * ratio);
    document.getElementById('fibre-' + id).textContent = Math.round(food.fibre * ratio);
  }

  function updateTotal() {
    let total = 0;
    let count = 0;
    document.querySelectorAll('.food-card:not(.removing)').forEach(card => {
      const id = card.id.split('-')[1];
      const calEl = document.getElementById('cal-' + id);
      if (calEl) total += parseInt(calEl.textContent) || 0;
      count++;
    });
    document.getElementById('totalCal').textContent = total;

    const btn = document.getElementById('confirmBtn');
    btn.innerHTML = '';
    const icon = document.createElement('i');
    icon.setAttribute('data-lucide', 'check');
    icon.style.width = '20px'; icon.style.height = '20px';
    btn.appendChild(icon);
    btn.appendChild(document.createTextNode(' Log ' + count + ' Item' + (count !== 1 ? 's' : '')));
    lucide.createIcons();
    btn.disabled = count === 0;
  }

  function removeCard(id, e) {
    e.stopPropagation();
    const card = document.getElementById('card-' + id);
    card.classList.add('removing');
    setTimeout(() => {
      card.remove();
      delete foods[id];
      document.querySelectorAll('.meal-section').forEach(section => {
        if (section.querySelectorAll('.food-card:not(.removing)').length === 0) {
          section.remove();
        }
      });
      updateTotal();
    }, 300);
  }

  function goBack() {
    showToast('Back to input');
  }

  function confirmLog() {
    const count = document.querySelectorAll('.food-card:not(.removing)').length;
    const total = document.getElementById('totalCal').textContent;
    showToast(count + ' items logged — ' + total + ' cal');

    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="loading-spinner" style="width:20px;height:20px;border-width:2px;"></div> Logging...';
    setTimeout(() => {
      btn.innerHTML = '&#10003; Logged';
    }, 600);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
