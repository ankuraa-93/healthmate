<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthMate — Add Food v2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #F2F2F7;
    --bg-tertiary: #E5E5EA;
    --text-primary: #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary: #AEAEB2;
    --accent: #34C759;
    --accent-secondary: #007AFF;
    --destructive: #FF3B30;
    --warning: #FF9500;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 999px;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-secondary);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex; justify-content: center;
  }
  .app-frame {
    width: 100%; max-width: 428px; min-height: 100dvh;
    background: rgba(0,0,0,0.3);
    position: relative; overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
  }

  /* Sheet */
  .sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--bg-primary);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    display: flex; flex-direction: column;
    max-height: 88vh;
  }
  .handle {
    width: 36px; height: 4px;
    background: var(--bg-tertiary);
    border-radius: var(--radius-full);
    margin: 10px auto 0;
    flex-shrink: 0;
  }

  /* Scrollable top area */
  .sheet-body {
    flex: 1; overflow-y: auto; padding: 16px 24px 0;
  }
  .sheet-body::-webkit-scrollbar { display: none; }
  .sheet-body { scrollbar-width: none; }

  .sheet-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .sheet-title { font-size: 22px; font-weight: 600; }
  .date-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-secondary); border-radius: var(--radius-full);
    padding: 6px 14px; border: none; font-family: inherit; cursor: pointer;
    position: relative;
  }
  .date-chip i { color: var(--text-secondary); }
  .date-text { font-size: 15px; color: var(--text-primary); font-weight: 500; }
  .hidden-date { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }

  /* Suggestions / Recommendations */
  .section-label {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.3px;
    margin-bottom: 10px;
  }

  /* Frequently logged items */
  .recent-items { margin-bottom: 20px; }
  .recent-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--bg-tertiary);
    cursor: pointer;
    transition: opacity 150ms;
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-item:active { opacity: 0.6; }
  .recent-thumb {
    width: 36px; height: 36px; border-radius: 8px;
    object-fit: cover; background: var(--bg-secondary); flex-shrink: 0;
  }
  .recent-info { flex: 1; min-width: 0; }
  .recent-name { font-size: 15px; font-weight: 500; }
  .recent-detail { font-size: 13px; color: var(--text-secondary); }
  .recent-add {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--bg-secondary); border: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); cursor: pointer; flex-shrink: 0;
    transition: background 150ms;
  }
  .recent-add:hover { background: var(--bg-tertiary); }

  /* Fixed bottom input bar — Gemini-style container */
  .input-bar {
    flex-shrink: 0;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 0.5px solid var(--bg-tertiary);
    background: var(--bg-primary);
  }
  .input-container {
    background: var(--bg-secondary);
    border-radius: 20px;
    padding: 14px 16px 10px;
    transition: box-shadow 200ms;
  }
  .input-container:focus-within { box-shadow: 0 0 0 2px rgba(52,199,89,0.25); }
  .food-input {
    width: 100%; background: none; border: none; resize: none;
    font-family: inherit; font-size: 16px; color: var(--text-primary);
    outline: none; line-height: 1.4;
  }
  .food-input::placeholder { color: var(--text-tertiary); }
  .input-actions {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px;
  }
  .mic-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-tertiary); border: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); cursor: pointer; flex-shrink: 0;
    transition: all 200ms;
  }
  .mic-btn.recording {
    background: var(--destructive); color: #fff;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,59,48,0.4); }
    50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255,59,48,0); }
  }
  .send-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; flex-shrink: 0;
    transition: transform 100ms, opacity 200ms;
  }
  .send-btn:active { transform: scale(0.9); }
  .send-btn:disabled { opacity: 0.35; cursor: default; }
  .send-btn:disabled:active { transform: none; }

  /* Waveform row (replaces suggestions when recording) */
  .waveform-area {
    display: none; flex-direction: column; align-items: center;
    padding: 20px 0; margin-bottom: 20px;
  }
  .waveform-area.visible { display: flex; }
  .waveform {
    display: flex; align-items: center; justify-content: center;
    gap: 3px; height: 48px; margin-bottom: 10px;
  }
  .waveform-bar {
    width: 3px; background: var(--destructive); border-radius: 2px;
    animation: wave 600ms ease-in-out infinite alternate;
  }
  .waveform-bar:nth-child(1)  { height: 10px; animation-delay: 0ms; }
  .waveform-bar:nth-child(2)  { height: 20px; animation-delay: 60ms; }
  .waveform-bar:nth-child(3)  { height: 30px; animation-delay: 120ms; }
  .waveform-bar:nth-child(4)  { height: 14px; animation-delay: 180ms; }
  .waveform-bar:nth-child(5)  { height: 34px; animation-delay: 240ms; }
  .waveform-bar:nth-child(6)  { height: 22px; animation-delay: 300ms; }
  .waveform-bar:nth-child(7)  { height: 12px; animation-delay: 360ms; }
  .waveform-bar:nth-child(8)  { height: 26px; animation-delay: 420ms; }
  .waveform-bar:nth-child(9)  { height: 16px; animation-delay: 480ms; }
  .waveform-bar:nth-child(10) { height: 24px; animation-delay: 540ms; }
  .waveform-bar:nth-child(11) { height: 18px; animation-delay: 600ms; }
  .waveform-bar:nth-child(12) { height: 28px; animation-delay: 660ms; }
  @keyframes wave { to { height: 4px; } }
  .wave-hint { font-size: 13px; color: var(--text-secondary); }

  /* Toast */
  .toast {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-primary); color: #fff;
    padding: 12px 20px; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 500; opacity: 0;
    pointer-events: none; transition: opacity 200ms, transform 200ms;
    white-space: nowrap; z-index: 30;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app-frame">
  <div class="sheet">
    <div class="handle"></div>

    <div class="sheet-body" id="sheetBody">
      <div class="sheet-header">
        <div class="sheet-title">Log Food</div>
        <button class="date-chip" onclick="document.getElementById('dp').showPicker()">
          <i data-lucide="calendar" style="width:14px;height:14px"></i>
          <span class="date-text" id="dateLabel">Today</span>
          <input type="date" class="hidden-date" id="dp" onchange="pickDate(this)">
        </button>
      </div>

      <!-- Frequently logged -->
      <div id="suggestionsArea">
        <div class="section-label">Frequently logged</div>
        <div class="recent-items">
          <div class="recent-item" onclick="fillInput('Scrambled eggs, 2 large')">
            <img class="recent-thumb" src="https://images.unsplash.com/photo-1525351484163-7529414344d8?w=80&h=80&fit=crop&q=80" alt="">
            <div class="recent-info">
              <div class="recent-name">Scrambled eggs</div>
              <div class="recent-detail">200g &middot; 320 cal</div>
            </div>
            <button class="recent-add"><i data-lucide="plus" style="width:16px;height:16px"></i></button>
          </div>
          <div class="recent-item" onclick="fillInput('Toast with butter')">
            <img class="recent-thumb" src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=80&h=80&fit=crop&q=80" alt="">
            <div class="recent-info">
              <div class="recent-name">Toast with butter</div>
              <div class="recent-detail">60g &middot; 185 cal</div>
            </div>
            <button class="recent-add"><i data-lucide="plus" style="width:16px;height:16px"></i></button>
          </div>
          <div class="recent-item" onclick="fillInput('Banana, 1 medium')">
            <img class="recent-thumb" src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=80&h=80&fit=crop&q=80" alt="">
            <div class="recent-info">
              <div class="recent-name">Banana</div>
              <div class="recent-detail">120g &middot; 105 cal</div>
            </div>
            <button class="recent-add"><i data-lucide="plus" style="width:16px;height:16px"></i></button>
          </div>
          <div class="recent-item" onclick="fillInput('Coffee with milk')">
            <img class="recent-thumb" src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=80&h=80&fit=crop&q=80" alt="">
            <div class="recent-info">
              <div class="recent-name">Coffee with milk</div>
              <div class="recent-detail">250ml &middot; 45 cal</div>
            </div>
            <button class="recent-add"><i data-lucide="plus" style="width:16px;height:16px"></i></button>
          </div>
        </div>
      </div>

      <!-- Waveform (shown during recording) -->
      <div class="waveform-area" id="waveformArea">
        <div class="waveform">
          <div class="waveform-bar"></div><div class="waveform-bar"></div><div class="waveform-bar"></div>
          <div class="waveform-bar"></div><div class="waveform-bar"></div><div class="waveform-bar"></div>
          <div class="waveform-bar"></div><div class="waveform-bar"></div><div class="waveform-bar"></div>
          <div class="waveform-bar"></div><div class="waveform-bar"></div><div class="waveform-bar"></div>
        </div>
        <span class="wave-hint">Listening... tap stop when done</span>
      </div>
    </div>

    <!-- Fixed bottom input bar — Gemini-style -->
    <div class="input-bar">
      <div class="input-container">
        <textarea class="food-input" id="foodInput" rows="2" placeholder="I just had omelette with toast" oninput="checkSend()"></textarea>
        <div class="input-actions">
          <button class="mic-btn" id="micBtn" onclick="toggleRec()">
            <i data-lucide="mic" style="width:18px;height:18px"></i>
          </button>
          <button class="send-btn" id="sendBtn" disabled onclick="submit()">
            <i data-lucide="arrow-up" style="width:18px;height:18px"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  lucide.createIcons();
  let rec = false;

  function checkSend() {
    document.getElementById('sendBtn').disabled = !document.getElementById('foodInput').value.trim();
  }

  function fillInput(text) {
    document.getElementById('foodInput').value = text;
    document.getElementById('foodInput').focus();
    checkSend();
  }

  function toggleRec() {
    rec = !rec;
    const btn = document.getElementById('micBtn');
    const wf = document.getElementById('waveformArea');
    const sugg = document.getElementById('suggestionsArea');
    const input = document.getElementById('foodInput');

    if (rec) {
      btn.classList.add('recording');
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>';
      wf.classList.add('visible');
      sugg.style.display = 'none';
      input.value = '';
      input.placeholder = 'Listening...';
      input.disabled = true;
      document.getElementById('sendBtn').disabled = true;
    } else {
      btn.classList.remove('recording');
      btn.innerHTML = '';
      const icon = document.createElement('i');
      icon.setAttribute('data-lucide', 'mic');
      icon.style.width = '18px'; icon.style.height = '18px';
      btn.appendChild(icon);
      lucide.createIcons();
      wf.classList.remove('visible');
      sugg.style.display = 'block';
      input.disabled = false;
      input.placeholder = 'I just had omelette with toast';
      input.value = '2 eggs and toast with butter';
      checkSend();
    }
  }

  function pickDate(el) {
    if (!el.value) return;
    const d = new Date(el.value + 'T12:00:00');
    const today = new Date(); today.setHours(12,0,0,0);
    const picked = new Date(d); picked.setHours(12,0,0,0);
    document.getElementById('dateLabel').textContent =
      picked.getTime() === today.getTime() ? 'Today' :
      d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function submit() {
    if (!document.getElementById('foodInput').value.trim()) return;
    const t = document.getElementById('toast');
    t.textContent = 'Food logged ✓';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
    document.getElementById('foodInput').value = '';
    document.getElementById('sendBtn').disabled = true;
  }
</script>
</body>
</html>
